[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-orchestra"
version = "0.1.0"
description = "Multi-Agent Cloud DevOps Orchestrator with closed-loop self-healing, adversarial security validation, RL-based FinOps, persistent memory, explainability, and multi-cloud harmonization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cloud-Orchestra Research Team" }]
keywords = ["multi-agent", "devops", "terraform", "reinforcement-learning", "llm", "self-healing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tenacity>=8.2",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
postgres = [
    "asyncpg>=0.29",
]
vector = [
    "chromadb>=0.4.24",
]
rl = [
    "torch>=2.2",
]
otel = [
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
cloud-orchestra = "cloud_orchestra.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_orchestra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=cloud_orchestra --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["cloud_orchestra"]
omit = [
    "*/rl/ppo.py",          # torch-gated module exercised only when torch is installed
    "*/providers/cloud.py", # external SDK clients exercised via mocks
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "src/cloud_orchestra/rl/ppo.py"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "chromadb", "asyncpg", "opentelemetry.*"]
ignore_missing_imports = true
