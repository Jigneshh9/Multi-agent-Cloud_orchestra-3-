apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-workers
  namespace: cloud-orchestra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-workers
  template:
    metadata:
      labels:
        app: agent-workers
    spec:
      containers:
        - name: agent-worker
          image: cloud-orchestra:latest
          command: ["cloud-orchestra", "run", "--all"]
          envFrom:
            - configMapRef:
                name: cloud-orchestra-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud-orchestra-secrets
                  key: LLM_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-orchestra-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-workers
  namespace: cloud-orchestra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-workers
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
