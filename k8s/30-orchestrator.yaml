apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: cloud-orchestra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: cloud-orchestra:latest
          command: ["cloud-orchestra", "api"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cloud-orchestra-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud-orchestra-secrets
                  key: LLM_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-orchestra-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: cloud-orchestra
spec:
  selector:
    app: orchestrator
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator
  namespace: cloud-orchestra
spec:
  rules:
    - host: cloud-orchestra.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 80
